plugins { id 'com.android.application' }

android {
    namespace 'com.cuime'
    compileSdk 34

    defaultConfig {
        applicationId "com.cuime"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint { abortOnError false }
}
